name: checks

# Small on purpose. Two failure modes matter for the demo:
#   1. data/zips.csv changes but prototype.html's embedded copy doesn't,
#      so the thing we present shows stale numbers.
#   2. someone pushes a Python file that doesn't run.
# Everything else we can catch by looking at it.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r data/requirements.txt -r policy_calculator/requirements.txt

      - name: Prototype data matches data/zips.csv
        working-directory: policy_calculator
        run: |
          python sync_data.py --check || {
            echo ""
            echo "The prototype's embedded data is out of date."
            echo "Fix: cd policy_calculator && python sync_data.py"
            echo "     (add --real only if data/zips.csv holds measured data)"
            exit 1
          }

      - name: Policy calculator runs
        working-directory: policy_calculator
        run: python run.py --featured-only

      - name: Ingest imports a source file
        run: |
          mkdir -p /tmp/ingest-check
          cat > /tmp/ingest-check/sample.csv <<'CSV'
          ZCTA5,Community Name,Median HH Income,Median Gross Rent,Rent YoY,Income YoY
          92113,Logan Heights,"$45,000","$1,900",5.5%,2.0%
          92037,La Jolla,"$145,000","$3,800",4.5%,4.0%
          CSV
          cd data && python ingest.py /tmp/ingest-check --feature-top 1
          # Leave the checkout clean: that write clobbered the committed CSV.
          git checkout -- zips.csv
